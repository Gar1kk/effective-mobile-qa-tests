name: API tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests/test_api_mock.py -v -s
