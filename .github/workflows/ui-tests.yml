name: UI tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Run UI test
        run: xvfb-run -a python -m pytest tests/test_purchase.py -v -s
